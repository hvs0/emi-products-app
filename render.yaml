services:
  - type: web
    name: emi-products-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CLIENT_ORIGIN
        value: https://emi-products-app.vercel.app
      - key: DATABASE_PATH
        value: /opt/render/project/src/server/data/catalog.sqlite
